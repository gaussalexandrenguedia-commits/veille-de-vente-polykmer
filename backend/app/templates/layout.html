<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titre }} — {{ app_name }}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="{{ active }}">
<nav class="sidebar">
  <a class="brand" href="/">📊 <span>Veille Vente<br><small>Cameroun · CEMAC</small></span></a>
  <a href="/" class="nav-link {% if active=='dashboard' %}on{% endif %}">🏠 Tableau de bord</a>
  <a href="/prix" class="nav-link {% if active=='prix' %}on{% endif %}">💰 Prix &amp; produits</a>
  <a href="/alertes" class="nav-link {% if active=='alertes' %}on{% endif %}">🚨 Alertes <span class="nav-badge" id="navAlertBadge" hidden></span></a>
  <a href="/sniper" class="nav-link {% if active=='sniper' %}on{% endif %}">⚡ Sniper temps réel</a>
  <a href="/social" class="nav-link {% if active=='social' %}on{% endif %}">💬 Écoute sociale</a>
  <a href="/releves" class="nav-link {% if active=='releves' %}on{% endif %}">📝 Relevés terrain</a>
  <a href="/ia" class="nav-link {% if active=='ia' %}on{% endif %}">🤖 Agent IA</a>
  <a href="/referentiels" class="nav-link {% if active=='referentiels' %}on{% endif %}">🗂️ Référentiels</a>
  <div class="side-foot">
    <a href="/docs" target="_blank" rel="noopener">📚 API</a>
    <span id="clock"></span>
  </div>
</nav>
<main>
  <header class="page-head">
    <h1>{{ titre }}</h1>
    <span class="live-dot" title="Données locales"><i></i>local</span>
  </header>
  {% block content %}{% endblock %}
  <footer>Veille Vente CM &amp; CEMAC · prix en XAF · <a href="/docs">API</a></footer>
</main>
<div id="toasts"></div>
<script src="/static/js/charts.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
